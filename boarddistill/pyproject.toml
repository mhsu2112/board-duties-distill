[project]
name = "boarddistill"
version = "0.1.0"
description = "Deterministic distillation engine — Lex-Balanus banking profile (slice one, fixtures-first)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "networkx>=3.2",
    "openpyxl>=3.1",
]

[project.scripts]
boarddistill = "cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["distillcore", "profiles", "adapters"]

[tool.hatch.build.targets.wheel.force-include]
"cli.py" = "cli.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["distillcore", "profiles", "adapters", "cli.py", "tests"]

[[tool.mypy.overrides]]
module = ["networkx.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["distillcore", "profiles", "adapters"]
